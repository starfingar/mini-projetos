<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Projetos</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        background-color: #f3f4f6;
        color: #1f2937;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 16px;
      }

      main {
        background: #ffffff;
        padding: 32px;
        border-radius: 12px;
        width: min(100%, 400px);
        text-align: center;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
        color: #111827;
      }

      p {
        color: #4b5563;
        font-size: 0.95rem;
        margin-bottom: 24px;
      }

      ul {
        list-style: none;
      }

      li {
        margin-bottom: 12px;
      }

      li a {
        display: block;
        padding: 12px 16px;
        background-color: #d236ff;
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: background-color 0.2s;
      }

      li a:hover {
        background-color: #de7bff;
      }

      footer {
        padding: 16px;
        width: min(100%, 600px);
        text-align: center;
        color: #6b7280;
        font-size: 0.875rem;
      }

      footer a {
        color: #374151;
        text-decoration: none;
        font-weight: 600;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mini Projetos</h1>
      <p>Explore os aplicativos desenvolvidos:</p>
      <ul>
        <li><a href="./todo-list/index.html">To-Do List</a></li>
      </ul>
    </main>
    <footer>
      <p>© 2026 — Desenvolvido por <a href="https://github.com/starfingar/">starfingar</a></p>
    </footer>
  </body>
</html>
