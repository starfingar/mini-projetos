<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>To-Do List</title>
</head>
<body>
  <header>
    <h1>To-Do List</h1>
    <p>Um gerenciador de tarefas clássico. Adicione suas metas diárias, remova o que já foi feito e fique tranquilo: sua lista fica salva no navegador e não some mesmo se você recarregar a página</p>
  </header>

  <main>
    <div class="input-group">
      <input type="text" id="todo-input" placeholder="Digite uma nova tarefa...">
      <button id="add-btn">Adicionar</button>
    </div>

    <ul id="todo-list"></ul>
  </main>

  <script src="./script.js"></script>
</body>
</html>
