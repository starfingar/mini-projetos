<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
  <title>Calculadora de Troco</title>
</head>
<body>
  <header>
    <h1>Calculadora de Troco</h1>
  </header>

  <main>
    <section id="secao-compra">
      <h2>1. Valor da Compra</h2>
      <div class="campo-input">
        <label for="input-compra">Total a pagar (R$):</label>
        <input type="number" id="input-compra" step="0.01" min="0" placeholder="0.00">
      </div>
    </section>

    <section id="secao-caixa">
      <h2>2. Dinheiro Recebido</h2>
      <p class="instrucao">Informe a quantidade de cada moeda que o cliente te entregou:</p>

      <div class="grade-moedas">
        <div class="cartao-moeda">
          <span class="label-moeda">1¢</span>
          <span class="contador" id="qtd-centavo1">0</span>
          <div class="controles">
            <button class="btn-controle" data-moeda="centavo1" data-acao="menos">-</button>
            <button class="btn-controle" data-moeda="centavo1" data-acao="mais">+</button>
          </div>
        </div>

        <div class="cartao-moeda">
          <span class="label-moeda">5¢</span>
          <span class="contador" id="qtd-centavo5">0</span>
          <div class="controles">
            <button class="btn-controle" data-moeda="centavo5" data-acao="menos">-</button>
            <button class="btn-controle" data-moeda="centavo5" data-acao="mais">+</button>
          </div>
        </div>

        <div class="cartao-moeda">
          <span class="label-moeda">25¢</span>
          <span class="contador" id="qtd-centavo25">0</span>
          <div class="controles">
            <button class="btn-controle" data-moeda="centavo25" data-acao="menos">-</button>
            <button class="btn-controle" data-moeda="centavo25" data-acao="mais">+</button>
          </div>
        </div>

        <div class="cartao-moeda">
          <span class="label-moeda">50¢</span>
          <span class="contador" id="qtd-centavo50">0</span>
          <div class="controles">
            <button class="btn-controle" data-moeda="centavo50" data-acao="menos">-</button>
            <button class="btn-controle" data-moeda="centavo50" data-acao="mais">+</button>
          </div>
        </div>

        <div class="cartao-moeda">
          <span class="label-moeda">R$ 1</span>
          <span class="contador" id="qtd-real1">0</span>
          <div class="controles">
            <button class="btn-controle" data-moeda="real1" data-acao="menos">-</button>
            <button class="btn-controle" data-moeda="real1" data-acao="mais">+</button>
          </div>
        </div>

      </div>
    </section>

    <section id="secao-resultados">
      <h2>3. Fechamento</h2>
      <div class="painel-valores">
        <p>Total Recebido: <strong id="valor-recebido">R$ 0.00</strong></p>
        <p>Troco a Devolver: <strong id="valor-troco">R$ 0.00</strong></p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 — Desenvolvido por <a href="https://github.com/starfingar/" target="_blank">starfingar</a></p>
  </footer>
</body>
</html>
