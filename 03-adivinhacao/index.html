<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
  <title>Jogo de Adivinhação</title>
</head>
<body>
  <header>
    <h1>Jogo de Adivinhação</h1>
  </header>

  <main>
    <div class="input-group">
      <input type="number" id="palpite-input" placeholder="Digite seu palpite (1 - 100)">
      <button id="enviar-btn">Enviar palpite</button>
    </div>

    <ol id="palpites">

    </ol>

    <p id="resposta"></p>
    <p id="tentativas">Tentativas: 0</p>
    <button id="reiniciar-btn">Reiniciar</button>
  </main>

  <footer>
    <p>© 2026 — Desenvolvido por <a href="https://github.com/starfingar/" target="_blank">starfingar</a></p>
  </footer>
</body>
</html>
